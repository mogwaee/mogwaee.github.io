<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahead Start</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <meta name="theme-color" content="#bd93f9" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="img/logo.jpg" alt="Ahead Start" />
        <h1>Ahead Start</h1>
      </div>
      <details class="theme-menu">
        <summary><span id="current-theme-name">Theme</span> <span aria-hidden="true">▾</span></summary>
        <div class="theme-settings">
          <label class="theme-picker" for="theme-select">
            <span>Theme</span>
            <select id="theme-select" aria-label="Choose theme"></select>
          </label>
          <div id="system-themes" class="system-themes" hidden>
            <label class="theme-picker" for="dark-theme-select">
              <span>Dark</span>
              <select id="dark-theme-select"></select>
            </label>
            <label class="theme-picker" for="light-theme-select">
              <span>Light</span>
              <select id="light-theme-select"></select>
            </label>
          </div>
        </div>
      </details>
    </header>
    <form class="search-box" method="get" action="https://www.google.com/search">
      <input type="search" name="q" placeholder="Search..." aria-label="Search Google">
    </form>
    <main>
      <div class="bookmarks-container">
        <p id="bookmark-status" role="status" hidden></p>
        <div class="row" id="bookmark-columns"></div>
      </div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
